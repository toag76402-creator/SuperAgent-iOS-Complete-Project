name: Build SuperAgent IPA

on:
  push:
    branches: [main, master, voice-tool-ollama]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d SuperAgent.xcodeproj

      - name: Run AgentLoop and tool-safety unit tests
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl create "CI iPhone 16" com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)"
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild test \
            -project SuperAgent.xcodeproj \
            -scheme SuperAgentTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build unsigned iOS app and ReplayKit extension
        run: |
          set -euo pipefail
          xcodebuild clean build \
            -project SuperAgent.xcodeproj \
            -scheme SuperAgent \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Validate app, extension, and bundle identifiers
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/SuperAgent.app"
          APPEX="$APP/PlugIns/SuperAgentBroadcast.appex"
          [[ -d "$APP" ]] || { echo "Missing app bundle: $APP"; exit 1; }
          [[ -d "$APPEX" ]] || { echo "Missing ReplayKit extension: $APPEX"; exit 1; }
          [[ -f "$APP/SuperAgent" ]] || { echo "Missing app executable"; exit 1; }
          [[ -f "$APPEX/SuperAgentBroadcast" ]] || { echo "Missing extension executable"; exit 1; }
          APP_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          EXTENSION_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX/Info.plist")"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          printf 'App bundle ID: %s\nExtension bundle ID: %s\nApp version: %s\n' "$APP_BUNDLE_ID" "$EXTENSION_BUNDLE_ID" "$APP_VERSION"
          [[ "$APP_BUNDLE_ID" == "com.custom.superagent.ai" ]] || { echo "Unexpected app bundle ID"; exit 1; }
          [[ "$EXTENSION_BUNDLE_ID" == "com.custom.superagent.ai.broadcast" ]] || { echo "Unexpected extension bundle ID"; exit 1; }
          [[ "$APP_VERSION" == "3.0.0" ]] || { echo "Unexpected app version"; exit 1; }

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/SuperAgent.app"
          rm -rf Payload SuperAgent.ipa
          mkdir -p Payload
          ditto "$APP" Payload/SuperAgent.app
          /usr/bin/zip -qry SuperAgent.ipa Payload
          shasum -a 256 SuperAgent.ipa > SuperAgent.ipa.sha256
          printf '%s\n' 'Unsigned IPA: add your own provisioning profiles and signatures before installation.' > SIGNING_REQUIRED.txt

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SuperAgent-Ready-To-Sign-IPA
          path: |
            SuperAgent.ipa
            SuperAgent.ipa.sha256
            SIGNING_REQUIRED.txt
          if-no-files-found: error
          retention-days: 30
